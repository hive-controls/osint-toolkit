# squid-routed.conf -- routed-proxy variant of squid.conf.
#
# Used ONLY when the launcher's network gate verified an operator-asserted upstream HTTP
# CONNECT proxy (routed-proxy mode). Every request is forced through that parent
# (never_direct); if the parent fails the request fails -- it never goes direct.
#
# This file must NOT resolve destination names locally: destination names are sent to the
# parent proxy unresolved so the lookup happens at the upstream, not on this host (closing the
# DNS leak). Squid forces a local lookup for any `dst` ACL, so none are used here, and
# the resolver is parked on loopback (see dns_nameservers below).
# dns_nameservers 127.0.0.1 exists because Squid 5.7 still resolves the CONNECT target in
# TunnelStateData even without dst ACLs; pointing the resolver at the sidecar's own loopback keeps
# that lookup inside the container (live packet capture not yet done).
#
# What routed mode trades away (honest accounting):
#   - The private/metadata/loopback destination blocklist (blocked_ipv4 / blocked_ipv6 dst
#     ACLs in squid.conf) cannot run without resolving the name locally, so it is REMOVED.
#     The operator-asserted upstream proxy becomes responsible for refusing private ranges.
#   - IP-literal destinations (dotted, decimal/hex, bracketed IPv6) are DENIED outright below,
#     which also stops raw-address probing of internal ranges through this sidecar.
#   - Name blocks (localhost, *.docker.internal, *.local) are kept as URL-text checks only; a
#     name that merely RESOLVES to a private address upstream is not caught here.
#   - The gate verified one CONNECT tunnel to one verify host through that proxy; it did not
#     and cannot audit what the proxy does with later traffic.

http_port 3128
visible_hostname user-scanner-egress

# Only the scanner-side internal network may use this proxy.
acl scanner_net src 172.30.0.0/24

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Destination checks that need NO name resolution (URL / CONNECT-target text only).
# Squid presents a CONNECT target as host:port.
acl ip_literal_host url_regex -i ^([a-z][a-z0-9+.-]*://)?([^/@]*@)?(\[|[0-9]{1,3}(\.[0-9]{1,3}){3}([:/]|$)|0x[0-9a-f]+([:/]|$)|[0-9]+([:/]|$))
acl blocked_name url_regex -i ^([a-z][a-z0-9+.-]*://)?([^/@]*@)?(localhost|host\.docker\.internal|gateway\.docker\.internal|[^/:]*\.local)\.?([:/]|$)

http_access deny !scanner_net
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_name
http_access deny ip_literal_host
http_access allow scanner_net
http_access deny all

# Do not cache scanner traffic or create persistent logs/state.
# Never go direct; the parent peer is declared in the included upstream file. This line is
# repeated here so an empty/default upstream file fails closed (503) instead of going direct.
never_direct allow all
include /etc/squid/upstream.d/upstream.conf

# Squid 5.7 still issues an A/AAAA lookup for the CONNECT target name after it connects to the
# parent (tunnel.cc, observed with debug section 78), even though no ACL needs it and the parent
# is an IP literal. Point the resolver at the container's own loopback so that lookup can never
# leave the sidecar's network namespace; it is unused here (the parent resolves the name).
dns_nameservers 127.0.0.1

cache deny all
cache_mem 16 MB
maximum_object_size_in_memory 0 KB
access_log stdio:/dev/stdout
cache_log /tmp/cache.log
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
pinger_enable off

forwarded_for delete
via off
