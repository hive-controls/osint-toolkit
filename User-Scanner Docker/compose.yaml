name: user-scanner-hardened

services:
  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: user-scanner-egress-proxy:local
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Launcher sets OSINT_SQUID_CONF=squid-routed.conf and OSINT_SQUID_UPSTREAM in routed-proxy mode.
    command: ["-f", "/etc/squid/${OSINT_SQUID_CONF:-squid.conf}"]
    volumes:
      - ${OSINT_SQUID_UPSTREAM:-./proxy/upstream.default.conf}:/etc/squid/upstream.d/upstream.conf:ro
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run/squid:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=13,gid=13
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=13,gid=13
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/squid.pid && kill -0 $$(cat /tmp/squid.pid)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    networks:
      - scanner-internal
      - proxy-egress
    restart: "no"

  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: user-scanner-hardened:1.5.1.3
    depends_on:
      egress-proxy:
        condition: service_healthy
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      ALL_PROXY: http://egress-proxy:3128
      OSINT_SUBJECT_AUTH: ${OSINT_SUBJECT_AUTH:-}
      # Set to 1 by run-scanner.ps1 only when providers.json has hudson_rock enabled + acknowledged.
      SCANNER_HUDSON_ALLOWED: ${SCANNER_HUDSON_ALLOWED:-}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - type: bind
        # The runner/menu exports this variable (data-root lane); plain `docker compose` falls back to the legacy default below.
        source: ${SCANNER_OUTPUT:-../OSINT/scanner}
        target: /output
    networks:
      - scanner-internal
    stdin_open: true
    tty: true
    restart: "no"

networks:
  scanner-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  proxy-egress:
    ipam:
      config:
        - subnet: 172.31.0.0/24
