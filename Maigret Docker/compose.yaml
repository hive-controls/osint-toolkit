name: maigret-hardened

services:
  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
      labels:
        maigret.build-inputs: ${MAIGRET_BUILD_INPUTS:-unset}
    image: maigret-egress-proxy:local
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Launcher sets OSINT_SQUID_CONF=squid-routed.conf and OSINT_SQUID_UPSTREAM in routed-proxy mode.
    command: ["-f", "/etc/squid/${OSINT_SQUID_CONF:-squid.conf}"]
    volumes:
      - ${OSINT_SQUID_UPSTREAM:-./proxy/upstream.default.conf}:/etc/squid/upstream.d/upstream.conf:ro
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run/squid:rw,noexec,nosuid,nodev,size=4m,mode=0700,uid=13,gid=13
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=13,gid=13
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/squid.pid && kill -0 $$(cat /tmp/squid.pid)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    networks:
      - maigret-internal
      - proxy-egress
    restart: "no"

  maigret:
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        maigret.build-inputs: ${MAIGRET_BUILD_INPUTS:-unset}
    image: maigret-hardened:0.6.4
    depends_on:
      egress-proxy:
        condition: service_healthy
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    # No HTTP(S)_PROXY env: maigret's aiohttp session uses trust_env=True, so these
    # would stack on top of the entrypoint's --proxy and tunnel to the proxy through
    # itself (CONNECT egress-proxy:3128 -> 403). The internal-only network already
    # forces all egress through Squid.
    environment:
      OSINT_SUBJECT_AUTH: ${OSINT_SUBJECT_AUTH:-}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    volumes:
      - type: bind
        # The runner/menu exports this variable (data-root lane); plain `docker compose` falls back to the legacy default below.
        source: ${MAIGRET_OUTPUT:-../OSINT/maigret}
        target: /output
    networks:
      - maigret-internal
    stdin_open: true
    tty: true
    restart: "no"

networks:
  maigret-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.34.0.0/24
  proxy-egress:
    ipam:
      config:
        - subnet: 172.35.0.0/24
