# Nightly image build + smoke. Needs outbound network: PyPI (wheelhouse fetch) and
# apt (inside the sidecar/tool image builds). Uploads nothing.
name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Fetch wheelhouses
        run: |
          for tool in "Maigret Docker" "Phone Lookup" "TorBot Docker" "User-Scanner Docker"; do
            python -I shared/build/fetch_wheelhouse.py --tool "$tool"
          done
      - name: Build images
        run: |
          for tool in "Maigret Docker" "Phone Lookup" "TorBot Docker" "User-Scanner Docker"; do
            docker compose -f "$tool/compose.yaml" build
          done
      - name: Smoke-run tool images (no network)
        run: |
          docker run --rm --network none maigret-hardened:0.6.4 --help > /dev/null
          docker run --rm --network none phone-lookup-hardened:0.1.0 --help > /dev/null
          docker run --rm --network none torbot-hardened:4.3.0 --help > /dev/null
          docker run --rm --network none user-scanner-hardened:1.5.1.3 --help > /dev/null
      - name: Third-party notices drift test
        run: python -m pytest -q tests/test_third_party_notices.py
      - name: Verify wheelhouses
        run: python -I shared/build/fetch_wheelhouse.py --all --verify-only
